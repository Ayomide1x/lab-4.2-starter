<!DOCTYPE html>
<html>
 
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block page_name %}{{ page_name }}{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
 
    <body>
        
        <nav class="navbar" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <a class="navbar-item site-logo" href="{{ url_for('home') }}">
                    🐱 Cats on Skis Wiki
                </a>
            </div>
            <div class="navbar-menu">
                <div class="navbar-end">
                    <a class="navbar-item" href="{{ url_for('home') }}">
                        Home
                    </a>
                    <a class="navbar-item" href="{{ url_for('all_pages') }}">
                        Pages
                    </a>
                    <a class="navbar-item" href="{{ url_for('about') }}">
                        About
                    </a>
                </div>
            </div>
        </nav>
 
        
        <div class="section">
            <div class="container content">
                {% block content %}{{ page_content }}{% endblock %}
            </div>
        </div>
 
        
        <footer class="footer">
            <div class="container has-text-centered">
                <p>Cats on Skis Wiki &copy; 2026</p>
            </div>
        </footer>
    </body>
 
</html>
